name: Pinball Pages

on:
  push:
    branches: [pinball-playtest]

# Deployment is opt-in through a repository variable, after Pages is enabled.
# A preparation commit marked [skip pages] can never deploy, even if the variable
# already exists. Do not add automatic Pages enablement to this workflow.
permissions:
  contents: read

concurrency:
  group: pages-pinball-playtest
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the playtest branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test physics and game state
        if: ${{ !contains(github.event.head_commit.message, '[presentation deploy]') }}
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Build and test the production game, including the Pages path
        env:
          PRESENTATION_ONLY: ${{ contains(github.event.head_commit.message, '[presentation deploy]') }}
        run: |
          if [ "$PRESENTATION_ONLY" = "true" ]; then
            npm run build
            npx playwright test tests/browser/static.spec.js
          else
            npm run test:browser
          fi

      - name: Assemble and verify all three releases
        run: |
          set -euo pipefail
          stable=039d558e34a968f38a28902d874ff3e38902de9e
          prototype=27e7ec49dadafd7aa3644114fe9eb90b7cfc38c3
          # The playtest output must come from precisely the approved game code.
          git diff --exit-code "$prototype" HEAD -- src index.html package.json package-lock.json vite.config.js
          mv dist /tmp/pinball-playtest-dist
          mkdir -p /tmp/pinball-live-source
          git archive "$stable" | tar -x -C /tmp/pinball-live-source
          (cd /tmp/pinball-live-source && npm ci && npm run build)
          # Check both the rebuilt root and the current live root against the
          # recorded release before publishing a replacement Pages artifact.
          test "$(find /tmp/pinball-live-source/dist -type f | wc -l)" -eq "$(wc -l < .github/pages/stable-039d558.sha256)"
          (cd /tmp/pinball-live-source/dist && sha256sum -c "$GITHUB_WORKSPACE/.github/pages/stable-039d558.sha256")
          while read -r expected file; do
            actual=$(curl --fail --silent --show-error --location "https://cosmicoutpost.github.io/roll4sanity-cthulhu-pinball/${file#./}" | sha256sum | cut -d' ' -f1)
            test "$actual" = "$expected" || { echo "Live file changed: $file"; exit 1; }
          done < .github/pages/stable-039d558.sha256
          # The previous prototype must remain byte-for-byte identical too.
          test "$(find /tmp/pinball-playtest-dist -type f | wc -l)" -eq "$(wc -l < .github/pages/prototype-27e7ec4.sha256)"
          (cd /tmp/pinball-playtest-dist && sha256sum -c "$GITHUB_WORKSPACE/.github/pages/prototype-27e7ec4.sha256")
          while read -r expected file; do
            actual=$(curl --fail --silent --show-error --location "https://cosmicoutpost.github.io/roll4sanity-cthulhu-pinball/playtest/${file#./}" | sha256sum | cut -d' ' -f1)
            test "$actual" = "$expected" || { echo "Existing playtest changed: $file"; exit 1; }
          done < .github/pages/prototype-27e7ec4.sha256
          # A fresh copy of the approved prototype receives only three positions.
          mkdir -p /tmp/pinball-candidate-source
          git archive "$prototype" | tar -x -C /tmp/pinball-candidate-source
          python3 .github/pages/build-candidate.py /tmp/pinball-candidate-source
          (cd /tmp/pinball-candidate-source && npm ci && node --test tests/candidate-all-faces.test.js && npm run build)
          mv /tmp/pinball-live-source/dist dist
          mv /tmp/pinball-playtest-dist dist/playtest
          mv /tmp/pinball-candidate-source/dist dist/playtest-candidate
          (cd dist && sha256sum -c "$GITHUB_WORKSPACE/.github/pages/stable-039d558.sha256")
          (cd dist/playtest && sha256sum -c "$GITHUB_WORKSPACE/.github/pages/prototype-27e7ec4.sha256")
          mkdir -p /tmp/pinball-dual-root
          ln -s "$GITHUB_WORKSPACE/dist" /tmp/pinball-dual-root/roll4sanity-cthulhu-pinball
          python3 -m http.server 5222 --directory /tmp/pinball-dual-root >/tmp/dual-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          DUAL_PAGES_URL=http://127.0.0.1:5222/roll4sanity-cthulhu-pinball/ PINBALL_BASE_URL=http://127.0.0.1:5222/roll4sanity-cthulhu-pinball/ npx playwright test tests/browser/dual-pages.spec.js tests/browser/candidate-test-mode.spec.js tests/browser/candidate-victory.spec.js tests/browser/candidate-layout.spec.js

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      ${{ github.ref == 'refs/heads/pinball-playtest' &&
          vars.PAGES_DEPLOY_ENABLED == 'true' &&
          !contains(github.event.head_commit.message, '[skip pages]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration without enabling it
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Deploy the dist artifact
        id: deployment
        uses: actions/deploy-pages@v4

  playtest-deployed:
    name: Playtest deployed game
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out playtest checks
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for live playtests
        run: npx playwright install --with-deps chromium

      - name: Play the published game and verify Stage 1 feedback and fitting
        env:
          PINBALL_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PRESENTATION_ONLY: ${{ contains(github.event.head_commit.message, '[presentation deploy]') }}
        run: |
          if [ "$PRESENTATION_ONLY" = "true" ]; then
            npx playwright test tests/browser/feedback.spec.js tests/browser/ritual.spec.js tests/browser/layered-art.spec.js --grep 'cabinet displays|table and essential controls fit|four real routes|static layers|actual phone touch'
          else
            npx playwright test tests/browser/play.spec.js tests/browser/feedback.spec.js --grep 'plays beyond the launch guide|Stage 1'
          fi

      - name: Check all published versions on desktop and mobile
        env:
          DUAL_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          PINBALL_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test tests/browser/dual-pages.spec.js tests/browser/candidate-test-mode.spec.js tests/browser/candidate-victory.spec.js tests/browser/candidate-layout.spec.js

      - name: Save live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-browser-evidence
          path: test-results/
          retention-days: 7
